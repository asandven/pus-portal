<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8C Skoleportal · Prøveplan</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .pp-container { max-width: 700px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 24px; }

  /* Ukemeny */
  .uke-nav { position: sticky; top: 68px; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .uke-nav-btn { font-size: 0.8rem; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; text-decoration: none; transition: all 0.15s; font-family: inherit; }
  .uke-nav-btn:hover { background: #fff1f2; color: var(--brand); border-color: var(--brand); }
  .uke-nav-btn.aktiv { background: var(--brand); color: white; border-color: var(--brand); }
  .uke-nav-btn.graaet { opacity: 0.4; }

  /* Vis alle-knapp */
  .vis-alle-wrap { text-align: center; padding: 0 16px; }
  .vis-alle-btn { font-size: 0.8rem; font-weight: 600; padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .vis-alle-btn:hover { background: #fff1f2; color: var(--brand); border-color: var(--brand); }

  /* Ukegruppe */
  .uke-gruppe { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; scroll-margin-top: 120px; transition: opacity 0.2s; }
  .uke-gruppe.graaet { opacity: 0.4; }
  .uke-gruppe.skjult { display: none; }
  .uke-header { background: var(--brand); color: white; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .uke-gruppe.graaet .uke-header { background: var(--text-muted); }
  .uke-header .uke-dato { font-weight: 400; opacity: 0.7; font-size: 0.72rem; font-family: 'DM Mono', monospace; }

  /* Prøve-rad */
  .prove-rad { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .prove-rad:last-child { border-bottom: none; }
  .prove-dag { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--text-muted); min-width: 72px; }
  .prove-fag { font-weight: 600; font-size: 0.95rem; flex: 1; }
  .prove-type { background: #fff1f2; color: var(--brand); font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .uke-gruppe.graaet .prove-type { background: var(--border); color: var(--text-muted); }

  .tom { padding: 20px 16px; color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
  .laster { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  /* Hero */
  .page-hero { background: var(--brand-dark); color: white; padding: 24px 0 20px; position: relative; overflow: hidden; border-bottom: 4px solid rgba(255,255,255,0.08); }
  .page-hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 80px); pointer-events: none; }
  .page-hero-inner { max-width: 700px; margin: 0 auto; padding: 0 16px; position: relative; }
  .page-hero .breadcrumb { font-size: 0.72rem; font-weight: 600; opacity: 0.55; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .page-hero .side-tittel { font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .page-hero .oppdatert { font-size: 0.72rem; opacity: 0.5; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<nav class="top-bar">
  <div class="nav-container">
    <a class="brand" href="index.html">
      <img src="puslogo.png" alt="PUS" class="brand-img">
      <span class="brand-text">8C – <span>Skoleportal</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-btn">← Hjem</a></li>
      <li><a href="ukeplan.html" class="nav-btn">Ukeplan</a></li>
      <li><a href="#" class="nav-btn active">Prøveplan</a></li>
    </ul>
  </div>
</nav>

<div id="app"><div class="laster">Laster prøveplan…</div></div>

<script>
const JSON_URL = 'https://raw.githubusercontent.com/asandven/pus-portal/main/data/proveplan.json';

function isoUke(dato) {
  const d = new Date(dato);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  return Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 86400000 + 1) / 7);
}

const innevaerendeUke = isoUke(new Date());
let visAlle = false;

function render(data) {
  const oppdatert = data.oppdatert
    ? new Date(data.oppdatert).toLocaleDateString('no-NO', {year:'numeric', month:'long', day:'numeric'})
    : '';

  const grupper = {};
  (data.prover || []).forEach(p => {
    if (!grupper[p.uke]) grupper[p.uke] = [];
    grupper[p.uke].push(p);
  });

  const alleUker = Object.keys(grupper).sort((a, b) => a - b);
  const fremtidigeUker = alleUker.filter(u => parseInt(u) >= innevaerendeUke);
  const gamleUker = alleUker.filter(u => parseInt(u) < innevaerendeUke);

  const uker = alleUker;

  const ukeNavKnapper = uker.map(uke => {
    const gammel = parseInt(uke) < innevaerendeUke;
    return `<a class="uke-nav-btn${gammel ? ' graaet' : ''}" href="#uke-${uke}">Uke ${uke}</a>`;
  }).join('');

  const ukeNav = uker.length > 1
    ? `<div class="uke-nav" id="uke-nav">${ukeNavKnapper}</div>`
    : '';

  const visAlleKnapp = gamleUker.length > 0
    ? `<div class="vis-alle-wrap"><button class="vis-alle-btn" id="vis-alle-btn" onclick="toggleVisAlle()">Vis tidligere uker</button></div>`
    : '';

  const innhold = uker.length
    ? uker.map(uke => {
        const gammel = parseInt(uke) < innevaerendeUke;
        return `
        <div class="uke-gruppe${gammel ? ' graaet skjult' : ''}" id="uke-${uke}">
          <div class="uke-header">
            <span>Uke ${uke}${gammel ? ' · Passert' : ''}</span>
          </div>
          ${grupper[uke].map(p => `
            <div class="prove-rad">
              <div class="prove-dag">${p.dag}</div>
              <div class="prove-fag">${p.fag}</div>
              <div class="prove-type">${p.type}</div>
            </div>`).join('')}
        </div>`;
      }).join('')
    : '<div class="uke-gruppe"><div class="tom">Ingen prøver registrert.</div></div>';

  document.getElementById('app').innerHTML = `
    <div class="page-hero">
      <div class="page-hero-inner">
        <div class="breadcrumb">8C – Skoleportal · Prøveplan</div>
        <div class="side-tittel">Prøveplan</div>
        ${oppdatert ? `<div class="oppdatert">Oppdatert ${oppdatert}</div>` : ''}
      </div>
    </div>
    ${ukeNav}
    <div class="pp-container">
      ${visAlleKnapp}
      ${innhold}
    </div>
  `;

  // Merk aktiv uke ved scroll
  if (uker.length > 1) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          document.querySelectorAll('.uke-nav-btn').forEach(btn => {
            btn.classList.toggle('aktiv', btn.getAttribute('href') === '#' + id);
          });
        }
      });
    }, { rootMargin: '-30% 0px -60% 0px' });

    uker.forEach(uke => {
      const el = document.getElementById('uke-' + uke);
      if (el) observer.observe(el);
    });
  }
}

function toggleVisAlle() {
  visAlle = !visAlle;
  document.querySelectorAll('.uke-gruppe.graaet').forEach(el => {
    el.classList.toggle('skjult', !visAlle);
  });
  const btn = document.getElementById('vis-alle-btn');
  if (btn) btn.textContent = visAlle ? 'Skjul tidligere uker' : 'Vis tidligere uker';
}

fetch(JSON_URL).then(r => r.json()).then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      `<div class="laster">Kunne ikke laste prøveplan: ${e.message}</div>`;
  });
</script>
</body>
</html>
