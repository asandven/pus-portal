<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8C · Likningsøving</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  .lk-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; }

  /* Hero */
  .lk-hero { background: var(--brand-dark); color: white; padding: 20px 0 16px; margin-bottom: 0; border-bottom: 4px solid rgba(255,255,255,0.08); }
  .lk-hero-inner { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  .lk-hero .breadcrumb { font-size: 0.72rem; font-weight: 600; opacity: 0.55; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .lk-hero .tittel { font-size: 1.8rem; font-weight: 700; line-height: 1; }

  /* Kort */
  .lk-kort { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 24px; margin-top: 24px; }

  /* Innlogging */
  .lk-felt { margin-bottom: 16px; }
  .lk-felt label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .lk-felt input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; background: var(--bg); color: var(--text); }
  .lk-felt input:focus { outline: none; border-color: var(--brand); }
  .lk-btn { width: 100%; padding: 12px; background: var(--brand); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 8px; }
  .lk-btn:hover { opacity: 0.9; }
  .lk-btn-sek { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .lk-feil { color: var(--brand); font-size: 0.85rem; margin-top: 8px; }

  /* Nivå-bar */
  .niva-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .niva-badge { background: var(--brand); color: white; padding: 3px 12px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; }
  .niva-navn { color: var(--text-muted); }
  .niva-variant { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--brand); }
  .rette-rad { display: flex; gap: 6px; }
  .rette-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg); }
  .rette-dot.fylt { background: #22c55e; border-color: #22c55e; }

  /* Oppgave */
  .oppgave-tekst { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; font-style: italic; }
  .oppgave-likning { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 500; margin: 16px 0; text-align: center; padding: 16px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }
  .svar-wrap { display: flex; gap: 10px; margin-top: 16px; }
  .svar-input { flex: 1; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1.1rem; font-family: 'DM Mono', monospace; text-align: center; background: var(--bg); color: var(--text); }
  .svar-input:focus { outline: none; border-color: var(--brand); }
  .svar-btn { padding: 12px 20px; background: var(--brand); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; }
  .hint-btn { padding: 12px 16px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; font-family: inherit; cursor: pointer; }

  /* Tilbakemelding */
  .tilbake { padding: 14px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600; font-size: 0.95rem; }
  .tilbake.riktig { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
  .tilbake.feil { background: #fff1f2; color: var(--brand); border: 1px solid #fecdd3; }
  .tilbake.hint-vis { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 400; }

  /* Løsningssteg */
  .steg-wrap { margin-top: 16px; }
  .steg-tittel { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .steg-grid { display: grid; grid-template-columns: 1fr 16px 1fr; gap: 6px 0; align-items: center; font-family: 'DM Mono', monospace; font-size: 1rem; line-height: 2; }
  .steg-eq { color: var(--text-muted); text-align: center; }
  .steg-op { color: #dc2626; font-weight: 600; }
  .steg-svar-linje { border-top: 1.5px solid var(--border); padding-top: 6px; font-weight: 600; }
  .steg-brok { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
  .steg-brok-strek { border-top: 1.5px solid #dc2626; width: 100%; display: block; }
  .steg-brok span { color: #dc2626; font-weight: 600; }

  /* Melding nivå-opp */
  .niva-opp-melding { background: var(--brand); color: white; padding: 16px; border-radius: 8px; text-align: center; font-weight: 600; margin-top: 16px; }

  /* Profil */
  .profil-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 0.82rem; color: var(--text-muted); }
  .logg-ut-btn { background: none; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; text-decoration: underline; font-family: inherit; }

  .laster { text-align: center; padding: 40px; color: var(--text-muted); }
  .skjult { display: none; }
</style>
</head>
<body>

<nav class="top-bar">
  <div class="nav-container">
    <a class="brand" href="index.html">
      <img src="puslogo.png" alt="PUS" class="brand-img">
      <span class="brand-text">8C – <span>Skoleportal</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-btn">← Hjem</a></li>
      <li><a href="ukeplan.html" class="nav-btn">Ukeplan</a></li>
    </ul>
  </div>
</nav>

<div class="lk-hero">
  <div class="lk-hero-inner">
    <div class="breadcrumb">8C – Skoleportal</div>
    <div class="tittel">Likningsøving</div>
  </div>
</div>

<!-- INNLOGGING -->
<div id="side-innlogging" class="lk-wrap">
  <div class="lk-kort">
    <h2 style="margin:0 0 20px; font-size:1.1rem;">Logg inn</h2>
    <div class="lk-felt">
      <label>Brukernavn</label>
      <input type="text" id="inn-bruker" placeholder="f.eks. 12C01" autocomplete="username" />
    </div>
    <div class="lk-felt">
      <label>Passord</label>
      <input type="password" id="inn-passord" placeholder="Passord" autocomplete="current-password" />
    </div>
    <div id="inn-feil" class="lk-feil skjult"></div>
    <button class="lk-btn" onclick="loggInn()">Logg inn</button>
  </div>

  <div class="lk-kort" style="margin-top:16px;">
    <h2 style="margin:0 0 8px; font-size:1rem;">Første gang?</h2>
    <p style="font-size:0.85rem; color:var(--text-muted); margin:0 0 16px;">Velg et passord du husker. Brukernavn får du av læreren.</p>
    <div class="lk-felt">
      <label>Bekreft passord</label>
      <input type="password" id="reg-passord2" placeholder="Skriv passordet en gang til" autocomplete="new-password" />
    </div>
    <div id="reg-feil" class="lk-feil skjult"></div>
    <button class="lk-btn lk-btn-sek" onclick="registrer()">Opprett bruker</button>
  </div>
</div>

<!-- OPPGAVE -->
<div id="side-oppgave" class="skjult">
  <div class="niva-bar" id="niva-bar">
    <div>
      <span class="niva-badge" id="niva-badge">Nivå 1a</span>
      <span class="niva-navn" id="niva-navn" style="margin-left:8px;"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="rette-rad" id="rette-rad">
        <div class="rette-dot" id="dot1"></div>
        <div class="rette-dot" id="dot2"></div>
        <div class="rette-dot" id="dot3"></div>
      </div>
      <button class="logg-ut-btn" onclick="loggUt()">Logg ut</button>
    </div>
  </div>

  <div class="lk-wrap">
    <div class="lk-kort">
      <div id="oppgave-tekst" class="oppgave-tekst skjult"></div>
      <div id="oppgave-likning" class="oppgave-likning laster">Henter oppgave…</div>

      <div class="svar-wrap">
        <input type="text" id="svar-input" class="svar-input" placeholder="x = ?" onkeydown="if(event.key==='Enter')sjekkSvar()" />
        <button class="svar-btn" onclick="sjekkSvar()">Sjekk</button>
        <button class="hint-btn" onclick="visHint()">Hint</button>
      </div>

      <div id="tilbakemelding" class="skjult"></div>
      <div id="steg-wrap" class="steg-wrap skjult"></div>
      <div id="niva-opp-melding" class="niva-opp-melding skjult"></div>

      <div style="margin-top:20px; text-align:right;">
        <button id="neste-btn" class="lk-btn skjult" onclick="nesteOppgave()">Neste oppgave →</button>
      </div>
    </div>

    <div class="profil-bar">
      <span id="profil-tekst"></span>
    </div>
  </div>
</div>

<script>
const API = 'https://vitalize-subtext-preheated.ngrok-free.dev';
let bruker = null;
let gjeldende = null;
let hintBrukt = false;

function vis(id) {
  ['side-innlogging', 'side-oppgave'].forEach(s => {
    document.getElementById(s).classList.toggle('skjult', s !== id);
  });
}

async function loggInn() {
  const b = document.getElementById('inn-bruker').value.trim();
  const p = document.getElementById('inn-passord').value.trim();
  const feil = document.getElementById('inn-feil');
  feil.classList.add('skjult');

  if (!b || !p) { feil.textContent = 'Fyll inn brukernavn og passord.'; feil.classList.remove('skjult'); return; }

  try {
    const resp = await fetch(`${API}/likning/logginn`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({brukernavn: b, passord: p})
    });
    const data = await resp.json();
    if (!resp.ok) { feil.textContent = data.error || 'Feil brukernavn eller passord.'; feil.classList.remove('skjult'); return; }
    bruker = data;
    vis('side-oppgave');
    oppdaterNivaBar();
    hentOppgave();
  } catch(e) {
    feil.textContent = 'Kunne ikke koble til server.'; feil.classList.remove('skjult');
  }
}

async function registrer() {
  const b = document.getElementById('inn-bruker').value.trim();
  const p = document.getElementById('inn-passord').value.trim();
  const p2 = document.getElementById('reg-passord2').value.trim();
  const feil = document.getElementById('reg-feil');
  feil.classList.add('skjult');

  if (!b || !p) { feil.textContent = 'Fyll inn brukernavn og passord øverst.'; feil.classList.remove('skjult'); return; }
  if (p !== p2) { feil.textContent = 'Passordene stemmer ikke overens.'; feil.classList.remove('skjult'); return; }
  if (p.length < 4) { feil.textContent = 'Passordet må være minst 4 tegn.'; feil.classList.remove('skjult'); return; }

  try {
    const resp = await fetch(`${API}/likning/registrer`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({brukernavn: b, passord: p})
    });
    const data = await resp.json();
    if (!resp.ok) { feil.textContent = data.error || 'Kunne ikke opprette bruker.'; feil.classList.remove('skjult'); return; }
    await loggInn();
  } catch(e) {
    feil.textContent = 'Kunne ikke koble til server.'; feil.classList.remove('skjult');
  }
}

function loggUt() {
  bruker = null; gjeldende = null;
  document.getElementById('inn-passord').value = '';
  document.getElementById('reg-passord2').value = '';
  vis('side-innlogging');
}

function oppdaterNivaBar() {
  if (!bruker) return;
  document.getElementById('niva-badge').textContent = `Nivå ${bruker.niva}${bruker.variant}`;
  const navn = {1:'Addisjon/subtraksjon',2:'Multiplikasjon/divisjon',3:'To steg',4:'x begge sider',5:'x høyre side',6:'Forenkle først',7:'Parentes én side',8:'Parentes begge sider',9:'Andregradslikning',10:'Alt blandet'};
  document.getElementById('niva-navn').textContent = navn[bruker.niva] || '';
  for (let i = 1; i <= 3; i++) {
    document.getElementById(`dot${i}`).classList.toggle('fylt', i <= bruker.rette_paa_rad);
  }
  document.getElementById('profil-tekst').textContent = `${bruker.brukernavn} · ${bruker.totalt_rette} rette / ${bruker.totalt_feil} feil`;
}

async function hentOppgave() {
  hintBrukt = false;
  gjeldende = null;
  document.getElementById('oppgave-likning').textContent = 'Henter oppgave…';
  document.getElementById('oppgave-likning').classList.add('laster');
  document.getElementById('oppgave-tekst').classList.add('skjult');
  document.getElementById('tilbakemelding').classList.add('skjult');
  document.getElementById('steg-wrap').classList.add('skjult');
  document.getElementById('niva-opp-melding').classList.add('skjult');
  document.getElementById('neste-btn').classList.add('skjult');
  document.getElementById('svar-input').value = '';
  document.getElementById('svar-input').disabled = false;

  try {
    const resp = await fetch(`${API}/likning/oppgave`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({brukernavn: bruker.brukernavn, niva: bruker.niva, variant: bruker.variant})
    });
    gjeldende = await resp.json();

    document.getElementById('oppgave-likning').classList.remove('laster');

    if (gjeldende.tekst) {
      document.getElementById('oppgave-tekst').textContent = gjeldende.tekst;
      document.getElementById('oppgave-tekst').classList.remove('skjult');
      document.getElementById('oppgave-likning').textContent = 'Sett opp likningen og løs den:';
      document.getElementById('oppgave-likning').style.fontSize = '1rem';
      document.getElementById('oppgave-likning').style.color = 'var(--text-muted)';
    } else {
      document.getElementById('oppgave-likning').textContent = gjeldende.oppgave;
      document.getElementById('oppgave-likning').style.fontSize = '1.6rem';
      document.getElementById('oppgave-likning').style.color = 'var(--text)';
    }

    document.getElementById('svar-input').focus();
  } catch(e) {
    document.getElementById('oppgave-likning').textContent = 'Feil — prøv igjen.';
  }
}

async function sjekkSvar() {
  if (!gjeldende) return;
  const input = document.getElementById('svar-input').value.trim().replace(',', '.').replace('x=','').replace('x =','').trim();
  const tilbake = document.getElementById('tilbakemelding');

  let riktig = false;
  if (Array.isArray(gjeldende.svar)) {
    const tall = parseFloat(input);
    riktig = gjeldende.svar.some(s => Math.abs(s) === Math.abs(tall));
  } else {
    riktig = parseFloat(input) === gjeldende.svar;
  }

  tilbake.className = 'tilbake ' + (riktig ? 'riktig' : 'feil');
  tilbake.textContent = riktig ? '✓ Riktig! Bra jobbet!' : `✗ Ikke helt riktig. Prøv igjen eller se hint.`;
  tilbake.classList.remove('skjult');

  if (riktig) {
    document.getElementById('svar-input').disabled = true;
    visSteg();
    document.getElementById('neste-btn').classList.remove('skjult');
  }

  const resp = await fetch(`${API}/likning/svar`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({brukernavn: bruker.brukernavn, riktig, hint_brukt: hintBrukt})
  });
  const data = await resp.json();
  bruker.niva = data.niva;
  bruker.variant = data.variant;
  bruker.rette_paa_rad = data.rette_paa_rad;
  bruker.totalt_rette = data.totalt_rette;
  bruker.totalt_feil = data.totalt_feil;
  oppdaterNivaBar();

  if (data.melding && (data.niva_opp || data.variant_opp)) {
    const m = document.getElementById('niva-opp-melding');
    m.textContent = data.melding;
    m.classList.remove('skjult');
  }
}

function visHint() {
  if (!gjeldende || !gjeldende.steg) return;
  hintBrukt = true;
  const tilbake = document.getElementById('tilbakemelding');
  const forste = gjeldende.steg[0];
  tilbake.className = 'tilbake hint-vis';
  tilbake.textContent = `Hint: ${forste.hwa || forste.hva ? 'Prøv å gjøre ' + (forste.hva || '') + ' på begge sider.' : 'Se på første steg i løsningen.'}`;
  tilbake.classList.remove('skjult');
}

function visSteg() {
  if (!gjeldende || !gjeldende.steg) return;
  const wrap = document.getElementById('steg-wrap');

  let html = '<div class="steg-tittel">Løsning</div><div class="steg-grid">';

  const steg = gjeldende.steg;
  for (let i = 0; i < steg.length; i++) {
    const s = steg[i];
    const erSvar = s.type === 'svar';
    const klasse = erSvar ? 'steg-svar-linje' : '';

    if (s.type === 'divisjon_brok') {
      const deler = s.fra.split('/');
      const teller = deler[0] || s.fra;
      const nevner = s.hva.replace('÷','').trim();
      html += `<span class="${klasse}"><span class="steg-brok"><span>${teller}</span><span class="steg-brok-strek"></span><span>${nevner}</span></span></span>`;
      html += `<span class="steg-eq ${klasse}">=</span>`;
      const deler2 = s.til.split('/');
      const teller2 = deler2[0] || s.til;
      html += `<span class="${klasse}"><span class="steg-brok"><span>${teller2}</span><span class="steg-brok-strek"></span><span>${nevner}</span></span></span>`;
    } else {
      const venstre = s.hva ? `${s.fra} <span class="steg-op">${s.hva}</span>` : `<strong>${s.fra}</strong>`;
      const hoyre = s.hva ? `${s.til.split(s.hva)[0] || s.til} <span class="steg-op">${s.hva}</span>` : `<strong>${s.til}</strong>`;
      html += `<span class="${klasse}">${venstre}</span>`;
      html += `<span class="steg-eq ${klasse}">=</span>`;
      html += `<span class="${klasse}">${erSvar ? '<strong>' + s.til + '</strong>' : hoyre}</span>`;
    }
  }

  html += '</div>';
  wrap.innerHTML = html;
  wrap.classList.remove('skjult');
}

function nesteOppgave() {
  hentOppgave();
}

// Enter på innlogging
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('side-innlogging').classList.contains('skjult')) {
    loggInn();
  }
});
</script>
</body>
</html>
