<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8C · Likningsøving</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
.lk-hero { background: var(--brand-dark); color: white; padding: 20px 0 16px; border-bottom: 4px solid rgba(255,255,255,0.08); }
.lk-hero-inner { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.lk-hero .breadcrumb { font-size: 0.72rem; font-weight: 600; opacity: 0.55; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.lk-hero .tittel { font-size: 1.8rem; font-weight: 700; line-height: 1; }
.niva-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
.niva-badge { background: var(--brand); color: white; padding: 3px 12px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; }
.niva-navn { color: var(--text-muted); margin-left: 8px; }
.rette-rad { display: flex; gap: 6px; }
.rette-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg); }
.rette-dot.fylt { background: #22c55e; border-color: #22c55e; }
.logg-ut-btn { background: none; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; text-decoration: underline; font-family: inherit; }
.tre-kol { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: 300px 1fr 260px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .tre-kol { grid-template-columns: 1fr; } .kol-eksempel, .kol-prog { display: none; } }
.kort { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
.kort-hdr { background: var(--brand); color: white; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 16px; }
.kort-body { padding: 16px; }
.eks-regel { background: var(--bg); border-left: 3px solid var(--brand); padding: 8px 12px; font-size: 0.82rem; border-radius: 0 6px 6px 0; margin-bottom: 12px; line-height: 1.5; }
.eks-tittel { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 16px 0 8px; }
.eks-grid { display: grid; grid-template-columns: 140px 12px 140px; gap: 4px 0; align-items: center; font-family: 'DM Mono', monospace; font-size: 0.95rem; line-height: 2; }
.eks-eq { color: var(--text-muted); text-align: center; }
.eks-op { color: #dc2626; font-weight: 600; }
.eks-svar { border-top: 1.5px solid var(--border); padding-top: 6px; font-weight: 600; }
.eks-brok { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
.eks-brok-strek { border-top: 1.5px solid #dc2626; width: 100%; display: block; }
.eks-brok span { color: #dc2626; font-weight: 600; font-size: 0.85rem; }
.oppgave-tekst { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; font-style: italic; }
.oppgave-likning { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 500; margin: 16px 0; text-align: center; padding: 16px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }
.steg-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 6px; display: block; }
.lk-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1.1rem; font-family: 'DM Mono', monospace; text-align: center; background: var(--bg); color: var(--text); }
.lk-input:focus { outline: none; border-color: var(--brand); }
.svar-wrap { display: flex; gap: 10px; margin-top: 6px; }
.svar-input { flex: 1; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1.1rem; font-family: 'DM Mono', monospace; text-align: center; background: var(--bg); color: var(--text); }
.svar-input:focus { outline: none; border-color: var(--brand); }
.svar-btn { padding: 12px 20px; background: var(--brand); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; }
.hint-btn { padding: 12px 16px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; font-family: inherit; cursor: pointer; }
.tilbake { padding: 14px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600; font-size: 0.95rem; }
.tilbake.riktig { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.tilbake.feil { background: #fff1f2; color: var(--brand); border: 1px solid #fecdd3; }
.tilbake.hint-vis { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
.likning-tilbake { margin-top: 6px; font-size: 0.85rem; }
.steg-wrap { margin-top: 16px; }
.steg-tittel { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.steg-grid { display: grid; grid-template-columns: 1fr 16px 1fr; gap: 6px 0; align-items: center; font-family: 'DM Mono', monospace; font-size: 1rem; line-height: 2; }
.steg-eq { color: var(--text-muted); text-align: center; }
.steg-op { color: #dc2626; font-weight: 600; }
.steg-svar-linje { border-top: 1.5px solid var(--border); padding-top: 6px; font-weight: 600; }
.steg-brok { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
.steg-brok-strek { border-top: 1.5px solid #dc2626; width: 100%; display: block; }
.steg-brok span { color: #dc2626; font-weight: 600; }
.niva-opp-melding { background: var(--brand); color: white; padding: 16px; border-radius: 8px; text-align: center; font-weight: 600; margin-top: 16px; }
.profil-bar { font-size: 0.82rem; color: var(--text-muted); margin-top: 12px; }
.lk-btn { width: 100%; padding: 12px; background: var(--brand); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 8px; }
.lk-btn-sek { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.lk-felt { margin-bottom: 16px; }
.lk-felt label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.lk-felt input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; background: var(--bg); color: var(--text); }
.lk-felt input:focus { outline: none; border-color: var(--brand); }
.lk-feil { color: var(--brand); font-size: 0.85rem; margin-top: 8px; }
.prog-niva { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
.prog-niva:last-child { border-bottom: none; }
.prog-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; min-width: 52px; text-align: center; }
.prog-badge.fullfort { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.prog-badge.aktiv { background: var(--brand); color: white; }
.prog-badge.ikke-start { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.prog-navn { color: var(--text-muted); font-size: 0.78rem; flex: 1; }
.laster { text-align: center; padding: 40px; color: var(--text-muted); }
.skjult { display: none; }
.inn-wrap { max-width: 440px; margin: 40px auto; padding: 0 16px; }
</style>
</head>
<body>

<nav class="top-bar">
  <div class="nav-container">
    <a class="brand" href="index.html">
      <img src="puslogo.png" alt="PUS" class="brand-img">
      <span class="brand-text">8C – <span>Skoleportal</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-btn">← Hjem</a></li>
      <li><a href="ukeplan.html" class="nav-btn">Ukeplan</a></li>
    </ul>
  </div>
</nav>

<div class="lk-hero">
  <div class="lk-hero-inner">
    <div class="breadcrumb">8C – Skoleportal</div>
    <div class="tittel">Likningsøving</div>
  </div>
</div>

<!-- INNLOGGING -->
<div id="side-innlogging">
  <div class="inn-wrap">
    <div class="kort" style="margin-bottom:16px;">
      <div class="kort-hdr">Logg inn</div>
      <div class="kort-body">
        <div class="lk-felt"><label>Brukernavn</label><input type="text" id="inn-bruker" placeholder="f.eks. 12C01" autocomplete="username" /></div>
        <div class="lk-felt"><label>Passord</label><input type="password" id="inn-passord" placeholder="Passord" autocomplete="current-password" /></div>
        <div id="inn-feil" class="lk-feil skjult"></div>
        <button class="lk-btn" onclick="loggInn()">Logg inn</button>
      </div>
    </div>
    <div class="kort">
      <div class="kort-hdr">Første gang?</div>
      <div class="kort-body">
        <p style="font-size:0.85rem; color:var(--text-muted); margin:0 0 16px;">Skriv brukernavn og velg passord øverst, bekreft her.</p>
        <div class="lk-felt"><label>Bekreft passord</label><input type="password" id="reg-passord2" placeholder="Skriv passordet en gang til" autocomplete="new-password" /></div>
        <div id="reg-feil" class="lk-feil skjult"></div>
        <button class="lk-btn lk-btn-sek" onclick="registrer()">Opprett bruker</button>
      </div>
    </div>
  </div>
</div>

<!-- OPPGAVE -->
<div id="side-oppgave" class="skjult">
  <div class="niva-bar">
    <div>
      <span class="niva-badge" id="niva-badge">Nivå 1a</span>
      <span class="niva-navn" id="niva-navn"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="rette-rad">
        <div class="rette-dot" id="dot1"></div>
        <div class="rette-dot" id="dot2"></div>
        <div class="rette-dot" id="dot3"></div>
      </div>
      <button class="logg-ut-btn" onclick="loggUt()">Logg ut</button>
    </div>
  </div>

  <div class="tre-kol">
    <!-- VENSTRE: Eksempel -->
    <div class="kol-eksempel">
      <div class="kort">
        <div class="kort-hdr" id="eks-hdr">Eksempel – Nivå 1</div>
        <div class="kort-body" id="eks-body"><div class="laster">…</div></div>
      </div>
    </div>

    <!-- MIDTEN: Oppgave -->
    <div class="kol-oppgave">
      <div class="kort">
        <div class="kort-hdr">Oppgave</div>
        <div class="kort-body">
          <div id="oppgave-tekst" class="oppgave-tekst skjult"></div>
          <div id="oppgave-likning" class="oppgave-likning laster">Henter oppgave…</div>

          <!-- D-variant: to felt -->
          <div id="d-felt" class="skjult">
            <label class="steg-label">Steg 1 — Skriv likningen din (bruk / som brøkstrek)</label>
            <input type="text" id="likning-input" class="lk-input" placeholder="f.eks. 6x = 72" />
            <div id="likning-tilbake" class="likning-tilbake skjult"></div>
            <label class="steg-label">Steg 2 — Løs likningen (skriv bare tallet)</label>
            <div class="svar-wrap">
              <input type="text" id="svar-input-d" class="svar-input" placeholder="x = ?" onkeydown="if(event.key==='Enter')sjekkSvar()" />
              <button class="svar-btn" onclick="sjekkSvar()">Sjekk</button>
              <button class="hint-btn" onclick="visHint()">Hint</button>
            </div>
          </div>

          <!-- A/B/C: ett felt -->
          <div id="abc-felt" class="svar-wrap">
            <input type="text" id="svar-input-abc" class="svar-input" placeholder="x = ?" onkeydown="if(event.key==='Enter')sjekkSvar()" />
            <button class="svar-btn" onclick="sjekkSvar()">Sjekk</button>
            <button class="hint-btn" onclick="visHint()">Hint</button>
          </div>

          <div id="tilbakemelding" class="skjult"></div>
          <div id="steg-wrap" class="steg-wrap skjult"></div>
          <div id="niva-opp-melding" class="niva-opp-melding skjult"></div>
          <div style="margin-top:20px; text-align:right;">
            <button id="neste-btn" class="lk-btn skjult" onclick="nesteOppgave()">Neste oppgave →</button>
          </div>
          <div class="profil-bar"><span id="profil-tekst"></span></div>
        </div>
      </div>
    </div>

    <!-- HØYRE: Progresjon -->
    <div class="kol-prog">
      <div class="kort">
        <div class="kort-hdr">Fremgang</div>
        <div class="kort-body" id="prog-body"><div class="laster">…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://vitalize-subtext-preheated.ngrok-free.dev';
const HDR = {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'};
let bruker = null, gjeldende = null, hintBrukt = false;

const NIVA_NAVN = {1:'Addisjon/subtraksjon',2:'Multiplikasjon/divisjon',3:'To steg',4:'x begge sider',5:'x høyre side',6:'Forenkle først',7:'Parentes én side',8:'Parentes begge sider',9:'Andregradslikning',10:'Alt blandet'};

const EKSEMPLER = {
  1:{regel:'Du kan legge til eller trekke fra det samme på begge sider for å få x alene.',steg:[{t:'rad',v:'x + 7',h:'15'},{t:'rad',v:'x + 7 <span class="eks-op">− 7</span>',h:'15 <span class="eks-op">− 7</span>'},{t:'svar',v:'x',h:'8'}]},
  2:{regel:'Del eller gang begge sider med samme tall. Bruk brøkstrek for divisjon.',steg:[{t:'rad',v:'3x',h:'21'},{t:'brok',tv:'3x',tn:'3',hv:'21',hn:'3'},{t:'svar',v:'x',h:'7'}]},
  3:{regel:'To steg: (1) flytt tallene, (2) del for å få x alene.',steg:[{t:'rad',v:'2x + 3',h:'11'},{t:'rad',v:'2x + 3 <span class="eks-op">− 3</span>',h:'11 <span class="eks-op">− 3</span>'},{t:'rad',v:'2x',h:'8'},{t:'brok',tv:'2x',tn:'2',hv:'8',hn:'2'},{t:'svar',v:'x',h:'4'}]},
  4:{regel:'Flytt alle x til venstre, alle tall til høyre.',steg:[{t:'rad',v:'2x + 3',h:'x + 8'},{t:'rad',v:'2x + 3 <span class="eks-op">− x</span>',h:'x + 8 <span class="eks-op">− x</span>'},{t:'rad',v:'x + 3 <span class="eks-op">− 3</span>',h:'8 <span class="eks-op">− 3</span>'},{t:'svar',v:'x',h:'5'}]},
  5:{regel:'Noen ganger er det lurere å samle x på høyre side.',steg:[{t:'rad',v:'3 + x',h:'2x − 4'},{t:'rad',v:'3 + x <span class="eks-op">− x</span>',h:'2x − 4 <span class="eks-op">− x</span>'},{t:'rad',v:'3 <span class="eks-op">+ 4</span>',h:'x − 4 <span class="eks-op">+ 4</span>'},{t:'svar',v:'7',h:'x  →  x = 7'}]},
  6:{regel:'Forenkle begge sider først — samle x-ledd og talledd.',steg:[{t:'rad',v:'2x + 3 + x',h:'5 + x − 2'},{t:'rad',v:'<span class="eks-op">3x</span> + 3',h:'x + <span class="eks-op">3</span>'},{t:'rad',v:'3x <span class="eks-op">− x</span>',h:'x <span class="eks-op">− x</span>'},{t:'brok',tv:'2x',tn:'2',hv:'0',hn:'2'},{t:'svar',v:'x',h:'0'}]},
  7:{regel:'Multipliser inn i parentesen først.',steg:[{t:'rad',v:'2(x + 4)',h:'16'},{t:'rad',v:'<span class="eks-op">2x + 8</span>',h:'16'},{t:'rad',v:'2x <span class="eks-op">− 8</span>',h:'16 <span class="eks-op">− 8</span>'},{t:'brok',tv:'2x',tn:'2',hv:'8',hn:'2'},{t:'svar',v:'x',h:'4'}]},
  8:{regel:'Multipliser inn i begge parentesene.',steg:[{t:'rad',v:'2(x + 3)',h:'3(x − 1)'},{t:'rad',v:'<span class="eks-op">2x + 6</span>',h:'<span class="eks-op">3x − 3</span>'},{t:'rad',v:'2x + 6 <span class="eks-op">− 2x</span>',h:'3x − 3 <span class="eks-op">− 2x</span>'},{t:'rad',v:'6 <span class="eks-op">+ 3</span>',h:'x − 3 <span class="eks-op">+ 3</span>'},{t:'svar',v:'9',h:'x  →  x = 9'}]},
  9:{regel:'Ta kvadratroten av begge sider. Husk: alltid to løsninger!',steg:[{t:'rad',v:'x²',h:'49'},{t:'rad',v:'<span class="eks-op">√x²</span>',h:'<span class="eks-op">√49</span>'},{t:'svar',v:'x',h:'±7'}]},
  10:{regel:'Alt kan komme! Bruk alle reglene du har lært.',steg:[{t:'rad',v:'3(x+2)+x',h:'2x+12'},{t:'rad',v:'4x+6 <span class="eks-op">− 2x</span>',h:'2x+12 <span class="eks-op">− 2x</span>'},{t:'rad',v:'2x+6 <span class="eks-op">− 6</span>',h:'12 <span class="eks-op">− 6</span>'},{t:'brok',tv:'2x',tn:'2',hv:'6',hn:'2'},{t:'svar',v:'x',h:'3'}]}
};

function byggEksempel(niva) {
  const e = EKSEMPLER[niva]||EKSEMPLER[1];
  let h = `<div class="eks-regel">${e.regel}</div><div class="eks-tittel">Eksempel</div><div class="eks-grid">`;
  for(const s of e.steg){
    if(s.t==='brok') h+=`<span><span class="eks-brok"><span>${s.tv}</span><span class="eks-brok-strek"></span><span>${s.tn}</span></span></span><span class="eks-eq">=</span><span><span class="eks-brok"><span>${s.hv}</span><span class="eks-brok-strek"></span><span>${s.hn}</span></span></span>`;
    else if(s.t==='svar') h+=`<span class="eks-svar">${s.v}</span><span class="eks-eq eks-svar">=</span><span class="eks-svar">${s.h}</span>`;
    else h+=`<span>${s.v}</span><span class="eks-eq">=</span><span>${s.h}</span>`;
  }
  return h+'</div>';
}

function oppdaterEksempel(niva){document.getElementById('eks-hdr').textContent=`Eksempel – Nivå ${niva}`;document.getElementById('eks-body').innerHTML=byggEksempel(niva);}

function byggProgresjon(){
  if(!bruker)return;
  let h='';
  for(let n=1;n<=10;n++){
    let st,et;
    if(n<bruker.niva){st='fullfort';et='✓';}
    else if(n===bruker.niva){st='aktiv';et=`${n}${bruker.variant}`;}
    else{st='ikke-start';et=`${n}`;}
    h+=`<div class="prog-niva"><span class="prog-badge ${st}">${et}</span><span class="prog-navn">${NIVA_NAVN[n]}</span></div>`;
  }
  document.getElementById('prog-body').innerHTML=h;
}

function vis(id){['side-innlogging','side-oppgave'].forEach(s=>document.getElementById(s).classList.toggle('skjult',s!==id));}

function getSvarInput(){return document.getElementById('d-felt').classList.contains('skjult')?document.getElementById('svar-input-abc'):document.getElementById('svar-input-d');}

async function loggInn(){
  const b=document.getElementById('inn-bruker').value.trim();
  const p=document.getElementById('inn-passord').value.trim();
  const feil=document.getElementById('inn-feil');
  feil.classList.add('skjult');
  if(!b||!p){feil.textContent='Fyll inn brukernavn og passord.';feil.classList.remove('skjult');return;}
  try{
    const resp=await fetch(`${API}/likning/logginn`,{method:'POST',headers:HDR,body:JSON.stringify({brukernavn:b,passord:p})});
    const data=await resp.json();
    if(!resp.ok){feil.textContent=data.error||'Feil brukernavn eller passord.';feil.classList.remove('skjult');return;}
    bruker=data;vis('side-oppgave');oppdaterNivaBar();oppdaterEksempel(bruker.niva);byggProgresjon();hentOppgave();
  }catch(e){feil.textContent='Kunne ikke koble til server.';feil.classList.remove('skjult');}
}

async function registrer(){
  const b=document.getElementById('inn-bruker').value.trim();
  const p=document.getElementById('inn-passord').value.trim();
  const p2=document.getElementById('reg-passord2').value.trim();
  const feil=document.getElementById('reg-feil');
  feil.classList.add('skjult');
  if(!b||!p){feil.textContent='Fyll inn brukernavn og passord øverst.';feil.classList.remove('skjult');return;}
  if(p!==p2){feil.textContent='Passordene stemmer ikke overens.';feil.classList.remove('skjult');return;}
  if(p.length<4){feil.textContent='Passordet må være minst 4 tegn.';feil.classList.remove('skjult');return;}
  try{
    const resp=await fetch(`${API}/likning/registrer`,{method:'POST',headers:HDR,body:JSON.stringify({brukernavn:b,passord:p})});
    const data=await resp.json();
    if(!resp.ok){feil.textContent=data.error||'Kunne ikke opprette bruker.';feil.classList.remove('skjult');return;}
    await loggInn();
  }catch(e){feil.textContent='Kunne ikke koble til server.';feil.classList.remove('skjult');}
}

function loggUt(){bruker=null;gjeldende=null;document.getElementById('inn-passord').value='';document.getElementById('reg-passord2').value='';vis('side-innlogging');}

function oppdaterNivaBar(){
  if(!bruker)return;
  document.getElementById('niva-badge').textContent=`Nivå ${bruker.niva}${bruker.variant}`;
  document.getElementById('niva-navn').textContent=NIVA_NAVN[bruker.niva]||'';
  for(let i=1;i<=3;i++)document.getElementById(`dot${i}`).classList.toggle('fylt',i<=bruker.rette_paa_rad);
  document.getElementById('profil-tekst').textContent=`${bruker.brukernavn} · ${bruker.totalt_rette} rette / ${bruker.totalt_feil} feil`;
}

async function hentOppgave(){
  const forrige=gjeldende?.oppgave||'';
  hintBrukt=false;gjeldende=null;
  document.getElementById('oppgave-likning').textContent='Henter oppgave…';
  document.getElementById('oppgave-likning').classList.add('laster');
  document.getElementById('oppgave-tekst').classList.add('skjult');
  document.getElementById('tilbakemelding').classList.add('skjult');
  document.getElementById('steg-wrap').classList.add('skjult');
  document.getElementById('niva-opp-melding').classList.add('skjult');
  document.getElementById('neste-btn').classList.add('skjult');
  document.getElementById('d-felt').classList.add('skjult');
  document.getElementById('abc-felt').classList.remove('skjult');
  document.getElementById('likning-input').value='';
  document.getElementById('likning-tilbake').classList.add('skjult');
  document.getElementById('svar-input-abc').value='';
  document.getElementById('svar-input-abc').disabled=false;
  document.getElementById('svar-input-d').value='';
  document.getElementById('svar-input-d').disabled=false;
  try{
    const resp=await fetch(`${API}/likning/oppgave`,{method:'POST',headers:HDR,body:JSON.stringify({brukernavn:bruker.brukernavn,niva:bruker.niva,variant:bruker.variant,forrige_oppgave:forrige})});
    gjeldende=await resp.json();
    document.getElementById('oppgave-likning').classList.remove('laster');
    if(gjeldende.tekst){
      document.getElementById('oppgave-tekst').textContent=gjeldende.tekst;
      document.getElementById('oppgave-tekst').classList.remove('skjult');
      document.getElementById('oppgave-likning').classList.add('skjult');
      document.getElementById('d-felt').classList.remove('skjult');
      document.getElementById('abc-felt').classList.add('skjult');
    }else{
      document.getElementById('oppgave-likning').textContent=gjeldende.oppgave;
      document.getElementById('oppgave-likning').style.fontSize='1.6rem';
      document.getElementById('oppgave-likning').style.color='var(--text)';
    }
    getSvarInput().focus();
  }catch(e){document.getElementById('oppgave-likning').textContent='Feil — prøv igjen.';}
}

async function sjekkSvar(){
  if(!gjeldende)return;
  if(gjeldende.tekst){
    const likningElev=document.getElementById('likning-input').value.trim();
    const lt=document.getElementById('likning-tilbake');
    if(!likningElev){lt.textContent='Skriv likningen din i Steg 1 først!';lt.style.color='var(--brand)';lt.classList.remove('skjult');return;}
    try{
      const vr=await fetch(`${API}/likning/valider`,{method:'POST',headers:HDR,body:JSON.stringify({likning:likningElev,fasit:gjeldende.oppgave})});
      const vd=await vr.json();
      lt.textContent=vd.riktig?'✓ '+vd.tilbakemelding:'✗ '+vd.tilbakemelding;
      lt.style.color=vd.riktig?'#15803d':'var(--brand)';
      lt.classList.remove('skjult');
      if(!vd.riktig)return;
    }catch(e){}
  }
  const si=getSvarInput();
  const input=si.value.trim().replace(',','.').replace(/x\s*=/,'').trim();
  const tilbake=document.getElementById('tilbakemelding');
  let riktig=false;
  if(Array.isArray(gjeldende.svar)){const t=parseFloat(input);riktig=gjeldende.svar.some(s=>Math.abs(s)===Math.abs(t));}
  else riktig=parseFloat(input)===gjeldende.svar;
  tilbake.className='tilbake '+(riktig?'riktig':'feil');
  tilbake.textContent=riktig?'✓ Riktig! Bra jobbet!':'✗ Ikke helt riktig. Prøv igjen eller se hint.';
  tilbake.classList.remove('skjult');
  if(riktig){si.disabled=true;visSteg();document.getElementById('neste-btn').classList.remove('skjult');}
  try{
    const resp=await fetch(`${API}/likning/svar`,{method:'POST',headers:HDR,body:JSON.stringify({brukernavn:bruker.brukernavn,riktig,hint_brukt:hintBrukt})});
    const data=await resp.json();
    bruker.niva=data.niva;bruker.variant=data.variant;bruker.rette_paa_rad=data.rette_paa_rad;
    bruker.totalt_rette=data.totalt_rette;bruker.totalt_feil=data.totalt_feil;
    oppdaterNivaBar();byggProgresjon();
    if(data.niva_opp)oppdaterEksempel(data.niva);
    if(data.melding&&(data.niva_opp||data.variant_opp)){const m=document.getElementById('niva-opp-melding');m.textContent=data.melding;m.classList.remove('skjult');}
  }catch(e){}
}

function visHint(){
  if(!gjeldende||!gjeldende.steg)return;
  hintBrukt=true;
  const forste=gjeldende.steg[0];
  const tilbake=document.getElementById('tilbakemelding');
  tilbake.className='tilbake hint-vis';
  tilbake.textContent=forste.hva?`Hint: Prøv å gjøre ${forste.hva} på begge sider.`:'Hint: Se eksempelet til venstre.';
  tilbake.classList.remove('skjult');
}

function visSteg(){
  if(!gjeldende||!gjeldende.steg)return;
  const wrap=document.getElementById('steg-wrap');
  let h='<div class="steg-tittel">Løsning</div><div class="steg-grid">';
  for(const s of gjeldende.steg){
    const erS=s.type==='svar';const kl=erS?'steg-svar-linje':'';
    if(s.type==='divisjon_brok'){
      const n=s.hva.replace('÷','').trim();
      h+=`<span class="${kl}"><span class="steg-brok"><span>${s.fra}</span><span class="steg-brok-strek"></span><span>${n}</span></span></span>`;
      h+=`<span class="steg-eq ${kl}">=</span>`;
      h+=`<span class="${kl}"><span class="steg-brok"><span>${s.til}</span><span class="steg-brok-strek"></span><span>${n}</span></span></span>`;
    }else{
      const v=s.hva?`${s.fra} <span class="steg-op">${s.hva}</span>`:`<strong>${s.fra}</strong>`;
      const hh=erS?`<strong>${s.til}</strong>`:(s.hva?`${s.til} <span class="steg-op">${s.hva}</span>`:`<strong>${s.til}</strong>`);
      h+=`<span class="${kl}">${v}</span><span class="steg-eq ${kl}">=</span><span class="${kl}">${hh}</span>`;
    }
  }
  h+='</div>';wrap.innerHTML=h;wrap.classList.remove('skjult');
}

function nesteOppgave(){hentOppgave();}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('side-innlogging').classList.contains('skjult'))loggInn();});
</script>
