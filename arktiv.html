<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8C Skoleportal · Ukeplan-arkiv</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .arkiv-container { max-width: 700px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 24px; }

  /* Ukemeny */
  .uke-nav { position: sticky; top: 68px; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .uke-nav-btn { font-size: 0.8rem; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; text-decoration: none; transition: all 0.15s; font-family: inherit; }
  .uke-nav-btn:hover { background: #fff1f2; color: var(--brand); border-color: var(--brand); }
  .uke-nav-btn.aktiv { background: var(--brand); color: white; border-color: var(--brand); }

  /* Ukeplan-kort */
  .uke-kort { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; scroll-margin-top: 120px; }
  .uke-header { background: var(--brand); color: white; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .uke-header .uke-dato { font-weight: 400; opacity: 0.7; font-size: 0.72rem; font-family: 'DM Mono', monospace; }

  /* Seksjoner */
  .seksjon { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .seksjon:last-child { border-bottom: none; }
  .seksjon-tittel { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }

  /* Meldinger */
  .melding { font-size: 0.9rem; padding: 4px 0; color: var(--text); }

  /* Lekser */
  .lekse-rad { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .lekse-rad:last-child { border-bottom: none; }
  .lekse-fag { font-weight: 700; font-size: 0.9rem; color: var(--brand); margin-bottom: 2px; }
  .lekse-tema { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
  .lekse-tekst { font-size: 0.88rem; }
  .laringsmal-liste { margin-top: 6px; padding-left: 16px; }
  .laringsmal-liste li { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }

  /* Prøver */
  .prove-tag { display: inline-block; background: #fff1f2; color: var(--brand); font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin: 3px 4px 3px 0; }

  .tom { padding: 20px 16px; color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
  .laster { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  /* Hero */
  .page-hero { background: var(--brand-dark); color: white; padding: 24px 0 20px; position: relative; overflow: hidden; border-bottom: 4px solid rgba(255,255,255,0.08); }
  .page-hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 80px); pointer-events: none; }
  .page-hero-inner { max-width: 700px; margin: 0 auto; padding: 0 16px; position: relative; }
  .page-hero .breadcrumb { font-size: 0.72rem; font-weight: 600; opacity: 0.55; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .page-hero .side-tittel { font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .page-hero .oppdatert { font-size: 0.72rem; opacity: 0.5; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<nav class="top-bar">
  <div class="nav-container">
    <a class="brand" href="index.html">
      <img src="puslogo.png" alt="PUS" class="brand-img">
      <span class="brand-text">8C – <span>Skoleportal</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-btn">← Hjem</a></li>
      <li><a href="ukeplan.html" class="nav-btn">Ukeplan</a></li>
      <li><a href="#" class="nav-btn active">Arkiv</a></li>
    </ul>
  </div>
</nav>

<div id="app"><div class="laster">Laster arkiv…</div></div>

<script>
const GITHUB_API = 'https://api.github.com/repos/asandven/pus-portal/contents/data/arkiv';
const RAW_BASE = 'https://raw.githubusercontent.com/asandven/pus-portal/main/data/arkiv';

async function lastArkiv() {
  // Hent liste over filer i arkiv-mappen
  const resp = await fetch(GITHUB_API);
  if (!resp.ok) throw new Error('Kunne ikke hente arkivliste');
  const filer = await resp.json();

  // Filtrer ut ukeplan-filer og sorter synkende (nyeste først)
  const ukefiler = filer
    .filter(f => f.name.startsWith('ukeplan_uke') && f.name.endsWith('.json'))
    .sort((a, b) => {
      const ukeA = parseInt(a.name.match(/\d+/)[0]);
      const ukeB = parseInt(b.name.match(/\d+/)[0]);
      return ukeB - ukeA;
    });

  if (ukefiler.length === 0) {
    document.getElementById('app').innerHTML = `
      <div class="page-hero"><div class="page-hero-inner">
        <div class="breadcrumb">8C – Skoleportal · Arkiv</div>
        <div class="side-tittel">Ukeplan-arkiv</div>
      </div></div>
      <div class="arkiv-container"><div class="uke-kort"><div class="tom">Ingen arkiverte ukeplaner ennå.</div></div></div>`;
    return;
  }

  // Hent alle ukeplaner parallelt
  const ukeplaner = await Promise.all(
    ukefiler.map(f => fetch(`${RAW_BASE}/${f.name}`).then(r => r.json()))
  );

  const ukenumre = ukeplaner.map(u => u.uke);

  const ukeNav = `<div class="uke-nav" id="uke-nav">
    ${ukenumre.map(u => `<a class="uke-nav-btn" href="#uke-${u}">Uke ${u}</a>`).join('')}
  </div>`;

  const innhold = ukeplaner.map(u => renderUkeplan(u)).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-hero">
      <div class="page-hero-inner">
        <div class="breadcrumb">8C – Skoleportal · Arkiv</div>
        <div class="side-tittel">Ukeplan-arkiv</div>
        <div class="oppdatert">${ukeplaner.length} uker arkivert</div>
      </div>
    </div>
    ${ukeNav}
    <div class="arkiv-container">${innhold}</div>
  `;

  // Merk aktiv uke ved scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        document.querySelectorAll('.uke-nav-btn').forEach(btn => {
          btn.classList.toggle('aktiv', btn.getAttribute('href') === '#' + id);
        });
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });

  ukenumre.forEach(u => {
    const el = document.getElementById('uke-' + u);
    if (el) observer.observe(el);
  });
}

function renderUkeplan(u) {
  const meldinger = (u.meldinger || []).map(m => `<div class="melding">• ${m}</div>`).join('') || '<div class="melding">Ingen meldinger</div>';
  const prover = (u.prover || []).map(p => `<span class="prove-tag">${p}</span>`).join('') || '<span style="color:var(--text-muted);font-size:0.88rem">Ingen prøver</span>';
  const lekser = (u.lekser || []).map(l => `
    <div class="lekse-rad">
      <div class="lekse-fag">${l.fag}</div>
      ${l.tema ? `<div class="lekse-tema">${l.tema}</div>` : ''}
      <div class="lekse-tekst">${l.lekse}</div>
      ${l.laringsmal && l.laringsmal.length ? `
        <ul class="laringsmal-liste">
          ${l.laringsmal.map(lm => `<li>${lm}</li>`).join('')}
        </ul>` : ''}
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:0.88rem;padding:4px 0">Ingen lekser registrert</div>';

  return `
    <div class="uke-kort" id="uke-${u.uke}">
      <div class="uke-header">
        <span>Uke ${u.uke}</span>
        <span class="uke-dato">${u.oppdatert || ''}</span>
      </div>
      <div class="seksjon">
        <div class="seksjon-tittel">Meldinger</div>
        ${meldinger}
      </div>
      <div class="seksjon">
        <div class="seksjon-tittel">Prøver</div>
        ${prover}
      </div>
      <div class="seksjon">
        <div class="seksjon-tittel">Lekser</div>
        ${lekser}
      </div>
    </div>`;
}

lastArkiv().catch(e => {
  document.getElementById('app').innerHTML =
    `<div class="laster">Kunne ikke laste arkiv: ${e.message}</div>`;
});
</script>
</body>
</html>
