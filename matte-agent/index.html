<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUS – Matte-assistent</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --border: #dde1e7;
  --text: #1a1e2e;
  --text-muted: #6b7280;
  --accent: #6B1A2A;
  --accent-light: #f9f0f1;
  --accent2: #8B2535;
  --green: #16a34a;
  --radius: 12px;
  --radius-sm: 8px;
  --header-h: 72px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
header {
  height: var(--header-h);
  background: #6B1A2A;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.logo {
  width: 48px;
  height: 48px;
  background: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -1px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.header-text h1 {
  color: white;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.header-text p {
  color: rgba(255,255,255,0.75);
  font-size: 14px;
  margin-top: 1px;
}

/* MAIN LAYOUT */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  gap: 0;
}

/* LEFT PANEL – oppgaver */
.left-panel {
  width: 380px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.left-panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.left-panel-header h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.chapter-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tab {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.tab.active { background: #6B1A2A; color: white; border-color: var(--accent); }
.tasks-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  font-size: 15.5px;
  line-height: 1.8;
  color: var(--text);
}
.tasks-content h3 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; color: var(--accent); }
.tasks-content h4 { font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.5px; }
.tasks-content ul { padding-left: 18px; margin: 4px 0; }
.tasks-content li { margin: 3px 0; }
.tasks-content li.clickable-task {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  margin: 4px 0;
  border: 1px solid transparent;
  transition: all 0.15s;
  list-style: none;
  margin-left: -18px;
  padding-left: 26px;
  position: relative;
}
.tasks-content li.clickable-task::before {
  content: "▶";
  position: absolute;
  left: 8px;
  font-size: 9px;
  color: #9ca3af;
  top: 7px;
}
.tasks-content li.clickable-task:hover {
  background: #f9f0f1;
  border-color: #6B1A2A;
  color: #6B1A2A;
}
.tasks-content li.clickable-task:hover::before { color: #6B1A2A; }
.tasks-content li.clickable-task.selected {
  background: #6B1A2A;
  color: white;
  border-color: #6B1A2A;
}
.tasks-content li.clickable-task.selected::before { color: white; }
.tasks-content p { margin: 4px 0; }
.difficulty-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  margin: 6px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.lav { background: #dcfce7; color: #16a34a; }
.middels { background: #fef9c3; color: #a16207; }
.hoy { background: #fee2e2; color: #dc2626; }

/* RIGHT PANEL – chat */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.msg { display: flex; flex-direction: column; gap: 3px; max-width: 80%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; }
.msg-label { font-size: 11px; color: var(--text-muted); }
.msg-bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15.5px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.msg.user .msg-bubble { background: #6B1A2A; color: white; border-bottom-right-radius: 4px; }
.msg.bot .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.bot .msg-bubble.thinking { color: var(--text-muted); font-style: italic; }

.chat-footer {
  padding: 12px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.quick-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.quick-btn {
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.1s;
}
.quick-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.input-row { display: flex; gap: 8px; }
#user-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
}
#user-input:focus { outline: 2px solid var(--accent); border-color: transparent; background: white; }
#send-btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: none;
  background: #6B1A2A;
  color: white;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
#send-btn:hover { opacity: 0.9; }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

  {

const fullTasksText = `Arbeidshefte i matematikk – 8. trinn, Presterød Ungdomsskole.

1. REGNEREKKEFØLGE: Huskeregel: parenteser, potenser, gange/dele, addere/subtrahere.
Lav: 4+3·2, 12−5·2, 20:4+7, 6+8:2, (4+2)·3, 18:(3+3), (10−6)·5, 24:(2·3)
Middels: 5+2·6−3, 18:3+4·2, (7+5)·2−8, 30−4·(5−2), 16:2·4, 40−6·3+8, (15−5):2+7, 3·(8−2)+5
Høy: 24−3·(4+2), 5·(8−3)+12:4, 48:(6−2)+7·3, (20−8):4+6·2. Lag uttrykk som gir 18/25/40 med minst tre regnearter.

2. PROSENT:
Lav: 10% av 50/120/300, 25% av 40/80/200, prosent av 5/10, 3/12, 15/20.
Middels: 15% av 200, 30% av 450, 12% av 150. Prosent: 18 av 60, 45 av 90, 16 av 80. En bukse koster 600 kr med 20% rabatt – finn rabatt og ny pris.
Høy: Mobil 4000 kr +15% (finn økning og ny pris), 84/120 elever på fotball (finn prosent), vare 1200 kr etter 25% rabatt (finn opprinnelig pris).

3. FUNKSJONER:
Lav: finn funksjonsuttrykk fra grafbeskrivelse, tegn y=x+2 og y=2x.
Middels: funksjonsuttrykk fra stigningstall og y-skjæring, verditabell for y=3x+1 og y=−2x+4.
Høy: En taxi tar 70 kr i startpris og 15 kr per kilometer – lag funksjonsuttrykk, finn prisen etter 8 km og tegn grafen. Et lys brenner ned 2 cm/time fra 30 cm – lag funksjonsuttrykk og finn høyde etter 5 timer.
GeoGebra: tegn y=2x+3, y=−x+4, y=0,5x−2. Utforsk stigningstall og konstantledd.

4. SCRATCH: Lav: forklar blokker, lag enkelt program. Middels: firkantbevegelse, løkker. Høy: spill med piltaster, poeng og tidsbegrensning, variabler.

5. ALGEBRA:
Trekke sammen: 2x+3x, 5a−2a, 4y+y, 7m−3m, 10k+2k (lav). 3x+4x−2x, 5a+2−3a, 8y−2y+6, sett inn x=4/y=3/a=2 (middels). To variabler, sett inn x=2 og y=5 (høy).
Forkorte brøker: 2x/4, 6a/3, 10y/5 (lav). 4x/8, 9a/3a, 12y/6 (middels). (6x+6)/6, 12ab/4a, 15x²/5x (høy).
Figurtall: aritmetiske rekker (lav/middels). Figurmønster +4 fra 3, formel for 2,5,8,11 (høy).

6. POTENSER: Lav: 2², 5², 10², √16, √25, √49. Middels: 3³, 2⁴, 5³, standardform. Høy: 2³·2², 10⁴:10², standardform og tilbake, √144, √196.

7. TALLREKKER: Lav: 2,4,6,8 og 10,20,30. Middels: geometrisk 3,6,12,24 og kvadrattall 1,4,9,16. Høy: 2,5,10,17,26 (øker med 3,5,7,9...) og Fibonacci 1,1,2,3,5,8.

8. LIKNINGER: Lav: x+4=10, y−3=8, 2a=12. Middels: 3x+2=14, 5y−7=18, 4a+8=20. Høy: 4x−7=21, 3(x+2)=18, 5a−2=3a+10, kino 120 kr/billett med 600 kr (sett opp likning). Sett alltid prøve.`;

function buildTabs() {
  const tabs = document.getElementById('chapter-tabs');
  chapters.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = ch.short;
    btn.onclick = () => selectChapter(i);
    tabs.appendChild(btn);
  });
}

function selectChapter(i) {
  currentChapter = i;
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  document.getElementById('tasks-content').innerHTML = chapters[i].content;
  makeTasksClickable();
}

function makeTasksClickable() {
  // Keywords that indicate rules/instructions, not tasks
  const skipPatterns = [
    /^regn ut parenteser/i,
    /^potenser$/i,
    /^ganging og deling/i,
    /^addisjon og subtraksjon/i,
    /^går framover/i,
    /^sier navnet/i,
    /^snur seg/i,
    /^beveger seg/i,
    /^skifter farge/i,
    /^spiller lyd/i,
    /^figuren styres/i,
    /^poeng øker/i,
    /^spillet stopper/i,
    /^for alltid/i,
    /^gjenta \d+/i,
    /^lag funksjonsuttrykk\.$/i,
    /^finn prisen etter/i,
    /^tegn grafen\.$/i,
    /^lag funksjonsuttrykk\.$/i,
    /^hvor høyt er/i,
    /^hva skjer når/i,
    /^skriv de fem/i,
    /^lag en formel\.$/i,
    /^sett prøve på svaret\.$/i,
    /^sett prøve på alle/i,
    /^sett opp en likning\.$/i,
    /^hvor mange billetter/i,
    /^hvor stor er rabatten/i,
    /^hva blir ny pris/i,
    /^hvor mye økte/i,
    /^hva er ny pris/i,
    /^lag funksjonsuttrykk/i,
    /^«.+»$/,           // Scratch blocks in guillemets
    /^forklar mønsteret\.$/i,
    /^du må bruke/i,
  ];

  const items = document.querySelectorAll('.tasks-content li');
  items.forEach(li => {
    const text = li.textContent.trim();
    // Must be longer than 3 chars and not match any skip pattern
    const skip = text.length <= 3 || skipPatterns.some(p => p.test(text));
    if (!skip) {
      li.classList.add('clickable-task');
      li.addEventListener('click', () => selectTask(li, text));
    }
  });
}

function selectTask(li, taskText) {
  // Deselect previous
  document.querySelectorAll('.clickable-task.selected').forEach(el => el.classList.remove('selected'));
  li.classList.add('selected');

  // Strip any markdown bold markers
  const cleanText = taskText.replace(/\*\*/g, '').trim();
  const chapterTitle = chapters[currentChapter].title;
  const prompt = `Jeg vil jobbe med denne oppgaven fra ${chapterTitle}:
"${cleanText}"`;
  sendMessage(prompt);
}

function addMsg(role, text, thinking) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'Deg' : '🤖 Matte-assistent';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (thinking ? ' thinking' : '');
  bubble.textContent = text;
  div.appendChild(label);
  div.appendChild(bubble);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return bubble;
}

async function sendMessage(userText) {
  if (!userText.trim()) return;
  const btn = document.getElementById('send-btn');
  const input = document.getElementById('user-input');
  btn.disabled = true;
  input.value = '';
  addMsg('user', userText);
  history.push({ role: 'user', content: userText });
  const bubble = addMsg('bot', 'Tenker…', true);

  const currentChapterTitle = chapters[currentChapter].title;
  const selectedTask = document.querySelector('.clickable-task.selected');
  const selectedTaskText = selectedTask ? selectedTask.textContent.trim() : null;
  const systemPrompt = `Du er en matematikk-assistent for elever på 8. trinn ved Presterød Ungdomsskole (PUS).

Her er oppgavene i arbeidsheftet:
---
${fullTasksText}
---

Eleven ser nå på: ${currentChapterTitle}${selectedTaskText ? "\nValgt oppgave: " + selectedTaskText : ""}

Slik jobber du:
1. Når eleven velger en oppgave: presenter den kort og tydelig, og spør bare "Hva er svaret ditt?"
2. Hvis svaret er RIKTIG: si "Riktig! 🎉" og gi en kort bekreftelse.
3. Hvis svaret er FEIL første gang: gi ett lite hint, spør om å prøve igjen.
4. Hvis svaret er FEIL andre gang: gi større hint med fremgangsmåte.
5. Hvis svaret er FEIL tredje gang: vis full løsning med forklaring.
6. Hvis eleven spør direkte om svaret: vis det med forklaring.

Viktig:
- Svar KORT. Maks 3-4 linjer.
- Aldri lange forklaringer før eleven har prøvd.
- Alltid norsk bokmål.
- Vennlig og oppmuntrende tone.
- KRITISK: Regn ALLTID ut fasiten selv FØRST, DERETTER sammenlign med elevens svar. Skriv aldri "Riktig!" og "feil" i samme svar. Bestem deg: er det riktig eller feil, og hold deg til det.
- Fasiten for denne oppgaven: regn den ut steg for steg i hodet ditt før du svarer eleven.`;

  try {
    const trimmedHistory = history.slice(-10);
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: [
          {
            type: 'text',
            text: systemPrompt,
            cache_control: { type: 'ephemeral' }
          }
        ],
        messages: trimmedHistory
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const rawReply = data.content?.find(b => b.type === 'text')?.text || 'Noe gikk galt.';
    const reply = rawReply.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
    bubble.textContent = reply;
    bubble.classList.remove('thinking');
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    bubble.textContent = '⚠️ Kunne ikke koble til. Prøv igjen.';
    bubble.classList.remove('thinking');
    history.pop();
  }
  btn.disabled = false;
  input.focus();
}

function quickSend(text) { sendMessage(text); }

// Init
buildTabs();
selectChapter(0);
addMsg('bot', 'Hei! 😊 Jeg er matte-assistenten din på PUS. Velg et kapittel til venstre, skriv svaret ditt på en oppgave, eller be om hint. Jeg gir deg ikke svaret med én gang – men jeg hjelper deg å forstå det!');

document.getElementById('send-btn').addEventListener('click', () => sendMessage(document.getElementById('user-input').value));
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(e.target.value); }
});
</script>
